[Rainmeter]
Update=30
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=True Damage Ekko Buttons
Author=AI
Description=Cyberpunk neon glitch buttons inspired by True Damage Ekko
Version=1.0

; ==========================================
; 变量与颜色定义 (真实伤害配色)
; ==========================================
[Variables]
; --- 几何尺寸 ---
; BtnW/BtnH 为按钮视觉宽高, BtnBodyX/BtnBodyW 为斜切后的实际矩形体
BtnW=260
BtnH=65
Skew=18
BtnBodyX=18
BtnBodyW=224
Gap=85
PadX=20
PadY=12

; --- 配色 ---
NeonPink=255,45,149
NeonPurple=123,47,247
NeonCyan=0,212,255
DarkBg=15,15,25

; --- 按钮文字 ---
Btn1Text=TRUE DAMAGE
Btn2Text=Z-DRIVE
Btn3Text=ACTIVATE

; --- 点击动作 ---
; 下面三个是默认值: 打开本主题的壁纸 / 媒体 / 皮肤目录
; 换成你自己的程序或文件即可, 例如: Btn1Cmd=["C:\Program Files\App\app.exe"]
Btn1Cmd=["explorer.exe" "#SKINSPATH#Ekko_theme\wallpaper"]
Btn2Cmd=["explorer.exe" "#SKINSPATH#Ekko_theme\media"]
Btn3Cmd=["explorer.exe" "#SKINSPATH#Ekko_theme\skin"]

; ==========================================
; 悬停能量值 (0=静息, 100=全亮) 与 故障透明度
; 每个按钮各自独立, 互不干扰
; ==========================================
[MeasureGlow1]
Measure=Calc
Formula=0
DynamicVariables=1

[MeasureGlow2]
Measure=Calc
Formula=0
DynamicVariables=1

[MeasureGlow3]
Measure=Calc
Formula=0
DynamicVariables=1

[MeasureGlitch1]
Measure=Calc
Formula=0
DynamicVariables=1

[MeasureGlitch2]
Measure=Calc
Formula=0
DynamicVariables=1

[MeasureGlitch3]
Measure=Calc
Formula=0
DynamicVariables=1

; ==========================================
; 悬停与点击动画 (ActionTimer)
; ==========================================
[MeasureAnim1]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat FadeIn1, 16, 10
FadeIn1=[!SetOption MeasureGlow1 Formula "(Clamp([MeasureGlow1]+10,0,100))"][!UpdateMeasure "MeasureGlow1"][!UpdateMeterGroup "B1"][!Redraw]
ActionList2=Repeat FadeOut1, 16, 10
FadeOut1=[!SetOption MeasureGlow1 Formula "(Clamp([MeasureGlow1]-10,0,100))"][!UpdateMeasure "MeasureGlow1"][!UpdateMeterGroup "B1"][!Redraw]
ActionList3=Repeat GlitchSeq1, 45, 6
GlitchSeq1=[!SetOption MeasureGlitch1 Formula "(230-[MeasureGlitch1])"][!UpdateMeasure "MeasureGlitch1"][!UpdateMeterGroup "B1"][!Redraw]
DynamicVariables=1

[MeasureAnim2]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat FadeIn2, 16, 10
FadeIn2=[!SetOption MeasureGlow2 Formula "(Clamp([MeasureGlow2]+10,0,100))"][!UpdateMeasure "MeasureGlow2"][!UpdateMeterGroup "B2"][!Redraw]
ActionList2=Repeat FadeOut2, 16, 10
FadeOut2=[!SetOption MeasureGlow2 Formula "(Clamp([MeasureGlow2]-10,0,100))"][!UpdateMeasure "MeasureGlow2"][!UpdateMeterGroup "B2"][!Redraw]
ActionList3=Repeat GlitchSeq2, 45, 6
GlitchSeq2=[!SetOption MeasureGlitch2 Formula "(230-[MeasureGlitch2])"][!UpdateMeasure "MeasureGlitch2"][!UpdateMeterGroup "B2"][!Redraw]
DynamicVariables=1

[MeasureAnim3]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat FadeIn3, 16, 10
FadeIn3=[!SetOption MeasureGlow3 Formula "(Clamp([MeasureGlow3]+10,0,100))"][!UpdateMeasure "MeasureGlow3"][!UpdateMeterGroup "B3"][!Redraw]
ActionList2=Repeat FadeOut3, 16, 10
FadeOut3=[!SetOption MeasureGlow3 Formula "(Clamp([MeasureGlow3]-10,0,100))"][!UpdateMeasure "MeasureGlow3"][!UpdateMeterGroup "B3"][!Redraw]
ActionList3=Repeat GlitchSeq3, 45, 6
GlitchSeq3=[!SetOption MeasureGlitch3 Formula "(230-[MeasureGlitch3])"][!UpdateMeasure "MeasureGlitch3"][!UpdateMeterGroup "B3"][!Redraw]
DynamicVariables=1

; ==========================================
; 样式定义 (保证大小形状完全一致)
; ==========================================
[StyleText]
FontFace=Arial Black
FontSize=16
FontWeight=900
FontColor=255,255,255,255
StringAlign=CenterCenter
StringStyle=Bold
AntiAlias=1
DynamicVariables=1

[StyleGlitchCyan]
FontFace=Arial Black
FontSize=16
FontWeight=900
FontColor=#NeonCyan#,[MeasureGlitch1]
StringAlign=CenterCenter
AntiAlias=1
DynamicVariables=1

[StyleGlitchPink]
FontFace=Arial Black
FontSize=16
FontWeight=900
FontColor=#NeonPink#,[MeasureGlitch1]
StringAlign=CenterCenter
AntiAlias=1
DynamicVariables=1

; ==========================================
; 按钮 1 : TRUE DAMAGE
; ==========================================
[MeterBtn1Bg]
Meter=Shape
X=#PadX#
Y=#PadY#
Shape=Rectangle #BtnBodyX#,0,#BtnBodyW#,#BtnH#,4,4 | Skew #Skew#,0 | Fill Color #DarkBg#,255 | StrokeWidth 2 | Stroke Color #NeonPurple#,(50+[MeasureGlow1]*2.05)
Shape2=Rectangle #BtnBodyX#,0,#BtnBodyW#,#BtnH#,4,4 | Skew #Skew#,0 | Fill Color 0,0,0,0 | StrokeWidth (3+[MeasureGlow1]/20) | Stroke Color #NeonCyan#,(15+[MeasureGlow1]*0.75)
AntiAlias=1
DynamicVariables=1
Group=B1
MouseOverAction=[!CommandMeasure MeasureAnim1 "Stop 2"][!CommandMeasure MeasureAnim1 "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureAnim1 "Stop 1"][!CommandMeasure MeasureAnim1 "Execute 2"]
LeftMouseDownAction=[!CommandMeasure MeasureAnim1 "Execute 3"]
LeftMouseUpAction=#Btn1Cmd#

[MeterBtn1Glitch1]
Meter=String
X=(#PadX#+#BtnBodyX#+#BtnBodyW#/2+3)
Y=(#PadY#+#BtnH#/2-2)
MeterStyle=StyleGlitchCyan
FontColor=#NeonCyan#,[MeasureGlitch1]
Text=#Btn1Text#
Group=B1

[MeterBtn1Glitch2]
Meter=String
X=(#PadX#+#BtnBodyX#+#BtnBodyW#/2-3)
Y=(#PadY#+#BtnH#/2+2)
MeterStyle=StyleGlitchPink
FontColor=#NeonPink#,[MeasureGlitch1]
Text=#Btn1Text#
Group=B1

[MeterBtn1Text]
Meter=String
X=(#PadX#+#BtnBodyX#+#BtnBodyW#/2)
Y=(#PadY#+#BtnH#/2)
MeterStyle=StyleText
Text=#Btn1Text#
Group=B1

; ==========================================
; 按钮 2 : Z 驱动 (Z-DRIVE)
; ==========================================
[MeterBtn2Bg]
Meter=Shape
X=#PadX#
Y=(#PadY#+#Gap#)
Shape=Rectangle #BtnBodyX#,0,#BtnBodyW#,#BtnH#,4,4 | Skew #Skew#,0 | Fill Color #DarkBg#,255 | StrokeWidth 2 | Stroke Color #NeonPurple#,(50+[MeasureGlow2]*2.05)
Shape2=Rectangle #BtnBodyX#,0,#BtnBodyW#,#BtnH#,4,4 | Skew #Skew#,0 | Fill Color 0,0,0,0 | StrokeWidth (3+[MeasureGlow2]/20) | Stroke Color #NeonCyan#,(15+[MeasureGlow2]*0.75)
AntiAlias=1
DynamicVariables=1
Group=B2
MouseOverAction=[!CommandMeasure MeasureAnim2 "Stop 2"][!CommandMeasure MeasureAnim2 "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureAnim2 "Stop 1"][!CommandMeasure MeasureAnim2 "Execute 2"]
LeftMouseDownAction=[!CommandMeasure MeasureAnim2 "Execute 3"]
LeftMouseUpAction=#Btn2Cmd#

[MeterBtn2Glitch1]
Meter=String
X=(#PadX#+#BtnBodyX#+#BtnBodyW#/2+3)
Y=(#PadY#+#Gap#+#BtnH#/2-2)
MeterStyle=StyleGlitchCyan
FontColor=#NeonCyan#,[MeasureGlitch2]
Text=#Btn2Text#
Group=B2

[MeterBtn2Glitch2]
Meter=String
X=(#PadX#+#BtnBodyX#+#BtnBodyW#/2-3)
Y=(#PadY#+#Gap#+#BtnH#/2+2)
MeterStyle=StyleGlitchPink
FontColor=#NeonPink#,[MeasureGlitch2]
Text=#Btn2Text#
Group=B2

[MeterBtn2Text]
Meter=String
X=(#PadX#+#BtnBodyX#+#BtnBodyW#/2)
Y=(#PadY#+#Gap#+#BtnH#/2)
MeterStyle=StyleText
Text=#Btn2Text#
Group=B2

; ==========================================
; 按钮 3 : 启动 (ACTIVATE)
; ==========================================
[MeterBtn3Bg]
Meter=Shape
X=#PadX#
Y=(#PadY#+#Gap#*2)
Shape=Rectangle #BtnBodyX#,0,#BtnBodyW#,#BtnH#,4,4 | Skew #Skew#,0 | Fill Color #DarkBg#,255 | StrokeWidth 2 | Stroke Color #NeonPurple#,(50+[MeasureGlow3]*2.05)
Shape2=Rectangle #BtnBodyX#,0,#BtnBodyW#,#BtnH#,4,4 | Skew #Skew#,0 | Fill Color 0,0,0,0 | StrokeWidth (3+[MeasureGlow3]/20) | Stroke Color #NeonCyan#,(15+[MeasureGlow3]*0.75)
AntiAlias=1
DynamicVariables=1
Group=B3
MouseOverAction=[!CommandMeasure MeasureAnim3 "Stop 2"][!CommandMeasure MeasureAnim3 "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureAnim3 "Stop 1"][!CommandMeasure MeasureAnim3 "Execute 2"]
LeftMouseDownAction=[!CommandMeasure MeasureAnim3 "Execute 3"]
LeftMouseUpAction=#Btn3Cmd#

[MeterBtn3Glitch1]
Meter=String
X=(#PadX#+#BtnBodyX#+#BtnBodyW#/2+3)
Y=(#PadY#+#Gap#*2+#BtnH#/2-2)
MeterStyle=StyleGlitchCyan
FontColor=#NeonCyan#,[MeasureGlitch3]
Text=#Btn3Text#
Group=B3

[MeterBtn3Glitch2]
Meter=String
X=(#PadX#+#BtnBodyX#+#BtnBodyW#/2-3)
Y=(#PadY#+#Gap#*2+#BtnH#/2+2)
MeterStyle=StyleGlitchPink
FontColor=#NeonPink#,[MeasureGlitch3]
Text=#Btn3Text#
Group=B3

[MeterBtn3Text]
Meter=String
X=(#PadX#+#BtnBodyX#+#BtnBodyW#/2)
Y=(#PadY#+#Gap#*2+#BtnH#/2)
MeterStyle=StyleText
Text=#Btn3Text#
Group=B3